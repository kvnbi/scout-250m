[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scout"
version = "0.0.1"
description = "Scout 250M: a small language model built to research"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "torch>=2.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
