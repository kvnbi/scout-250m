[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scout"
version = "0.0.1"
description = "Scout 250M: a small language model built to research"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "torch>=2.9",
    "numpy>=2.3.2",
    "pyarrow>=22",
    "tokenizers>=0.23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scout.tokenizer" = ["tokenizer.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
